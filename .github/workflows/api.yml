name: Build and deploy GradeOps AI modular backend

on:
  push:
    branches: [master]
    paths:
      - 'pom.xml'
      - 'api/**'
      - 'agents/**'
  pull_request:
    branches: [develop, master]
    paths:
      - 'pom.xml'
      - 'api/**'
      - 'agents/**'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify modular backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            pom.xml
            api/pom.xml
            agents/pom.xml

      - name: Run backend tests
        run: ./api/mvnw -f pom.xml -pl api -am -Pbeta test

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build container image
        if: github.event_name == 'push'
        run: |
          docker build --build-arg MAVEN_PROFILE=demo \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/grade-ops-ai/grade-ops-ai-api:${{ github.sha }} \
            -f api/Dockerfile .

      - name: Push image to Artifact Registry
        if: github.event_name == 'push'
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/grade-ops-ai/grade-ops-ai-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: github.event_name == 'push'
        run: |
          gcloud run deploy grade-ops-ai-api \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/grade-ops-ai/grade-ops-ai-api:${{ github.sha }} \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --update-env-vars CORS_ALLOWED_ORIGINS=${{ secrets.WEB_URL }}
