# Active when SPRING_PROFILES_ACTIVE=beta (Render / local provider-backed environment)

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:gradeops}
    password: ${DATABASE_PASSWORD:}
  ai:
    google:
      genai:
        api-key: ${GRADEOPS_GEMINI_API_KEY}
        chat:
          options:
            model: ${GRADEOPS_GEMINI_MODEL:gemini-2.0-flash}
    openai:
      api-key: ${GRADEOPS_GROQ_API_KEY}
      base-url: ${GRADEOPS_GROQ_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        options:
          model: ${GRADEOPS_GROQ_MODEL:llama-3.3-70b-versatile}

firebase:
  credentials-json: ${FIREBASE_ADMIN_CREDENTIALS:}

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET:gradeops-beta}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  agents:
    enabled: ${GRADEOPS_AI_ENABLED:true}
    llm:
      default-provider: ${GRADEOPS_DEFAULT_PROVIDER:groq}
      cost-per-1k-tokens:
        gemini: ${GRADEOPS_GEMINI_COST_PER_1K_TOKENS:0.000075}
        groq: ${GRADEOPS_GROQ_COST_PER_1K_TOKENS:0.0}
